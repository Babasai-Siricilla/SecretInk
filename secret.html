<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretInk</title>
  <link rel="stylesheet" href="secret.css">
</head>
<body>
  <div class="app">
    <h1>🔐 Secret<span>Ink</span></h1>
    <p>Write it. Hide it. Share it.</p>

    <div class="tabs">
      <button onclick="setMode('encode')">Encode</button>
      <button onclick="setMode('decode')">Decode</button>
    </div>

    <textarea id="message" placeholder="Enter your message..."></textarea>

    <button class="main-btn" onclick="processMessage()">Encode Message</button>

    <textarea id="result" placeholder="Your result appears here..." readonly></textarea>

    <button onclick="copyMessage()">📋 Copy Result</button>
    <button onclick="clearAll()">Clear</button>

    <p id="status"></p>
  </div>

  <script src="secret.js"></script>
</body>
</html>
